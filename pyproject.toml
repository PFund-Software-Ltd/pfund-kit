[project]
name = "pfund-kit"
version = "0.1.21"
description = "Configuration, CLI, and shared utilities for packages in pfund's ecosystem"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Stephen Yau", email = "softwareentrepreneer+pfund-kit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "tqdm>=4.70.1",
    "click>=8.5.0",
    "trogon>=0.6.0 ; sys_platform != 'emscripten'",
    "pyyaml>=6.0.3",
    "tomlkit>=0.15.1",
    "packaging>=26.3",
    "pydantic>=2.13.5",
    # "platformdirs>=4.3.6",
    "python-dotenv>=1.2.3",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
pfund-shell = "pfund_kit.pfund_shell.main:start_shell"

[project.urls]
homepage = "https://pfund.ai"
repository = "https://github.com/PFund-Software-Ltd/pfund-kit"
# documentation = ""

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"

[tool.pyright]
typeCheckingMode = "basic"
# reportAny = false
# reportExplicitAny = false

[tool.uv.build-backend]
module-name = "pfund_kit"
module-root = "src"
